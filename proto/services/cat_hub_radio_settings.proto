syntax = "proto3";

package qsoripper.services;

option csharp_namespace = "QsoRipper.Services";

// The CAT hub `[cat_hub.radio]` section: which radio the hub owns and how it
// reaches it. `backend` is required when the enclosing CatHubSettings is written;
// omitted scalar fields fall back to the cathub daemon defaults.
message CatHubRadioSettings {
  // Backend selector: `ts590`, `rigctld`, or `loopback`.
  optional string backend = 1;
  // Human-readable / Hamlib model id (e.g. `TS-590SG`, `2014`).
  optional string model = 2;
  // `serial` or `tcp`.
  optional string transport = 3;
  // Serial port path (e.g. `COM4`, `/dev/ttyUSB0`).
  optional string port = 4;
  // Serial baud rate.
  optional uint32 baud = 5;
  // TCP host (for `tcp` transport or the rigctld bridge).
  optional string host = 6;
  // TCP port.
  optional uint32 tcp_port = 7;
  // Whether a bridge backend has been operator-certified.
  optional bool certified = 8;
  // Per-command reply timeout in milliseconds.
  optional uint64 reply_timeout_ms = 9;
}
