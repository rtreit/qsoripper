syntax = "proto3";

package qsoripper.services;

option csharp_namespace = "QsoRipper.Services";

import "services/runtime_config_value_source.proto";

message RuntimeConfigValue {
  string key = 1;
  bool has_value = 2;
  string display_value = 3;
  bool overridden = 4;
  bool secret = 5;
  bool redacted = 6;
  RuntimeConfigValueSource source = 7;
}
