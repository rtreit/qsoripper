syntax = "proto3";

package qsoripper.services;

option csharp_namespace = "QsoRipper.Services";

import "services/cw_keyer_backend.proto";

message CwKeyerStatus {
  CwKeyerBackend backend = 1;
  bool available = 2;
  uint32 speed_wpm = 3;
  optional string port_name = 4;
  optional string error_message = 5;
  bool transmit_enabled = 6;
  uint64 max_tx_ms = 7;
  optional uint32 firmware_revision = 8;
  optional string broker_endpoint = 9;
  optional uint32 pot_wpm = 10;
  bool busy = 11;
  optional string last_safety_action = 12;
}
