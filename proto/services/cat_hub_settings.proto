syntax = "proto3";

package qsoripper.services;

option csharp_namespace = "QsoRipper.Services";

import "services/cat_hub_event_settings.proto";
import "services/cat_hub_hamlib_net_endpoint.proto";
import "services/cat_hub_poll_settings.proto";
import "services/cat_hub_ptt_settings.proto";
import "services/cat_hub_radio_settings.proto";
import "services/cat_hub_serial_endpoint.proto";
import "services/cat_hub_winkeyer_endpoint.proto";
import "services/cat_hub_winkeyer_settings.proto";

// The complete `[cat_hub]` configuration the QsoRipper engine reads and writes
// on behalf of the standalone cathub daemon. The engine owns this section so the
// setup wizard can add, edit, and remove the client programs that use the hub
// without operators hand-editing TOML.
//
// FULL-REPLACEMENT semantics: when this message is present it is the COMPLETE
// desired `[cat_hub]` section and the engine rewrites the section to match it.
// `radio` is required and must name a backend, and at least one endpoint (a
// `serial_endpoints` or `hamlib_net` entry) is required. Omitted scalar fields fall back to
// the cathub daemon defaults. Omit the whole CatHubSettings message to leave the
// existing `[cat_hub]` section (including comments and unknown keys) untouched.
message CatHubSettings {
  // Radio link the hub owns.
  optional CatHubRadioSettings radio = 1;
  // Poll cadence.
  optional CatHubPollSettings poll = 2;
  // Transmit safety ceiling.
  optional CatHubPttSettings ptt = 3;
  // Native push policy.
  optional CatHubEventSettings events = 4;
  // Serial endpoints (com0com pairs) for applications that speak CAT over serial.
  repeated CatHubSerialEndpoint serial_endpoints = 5;
  // rigctld-compatible TCP endpoints for network-CAT applications.
  repeated CatHubHamlibNetEndpoint hamlib_net = 6;
  // Optional physical WinKeyer broker owned by CatHub.
  optional CatHubWinkeyerSettings winkeyer = 7;
  // Virtual WinKeyer serial endpoints for legacy applications such as N1MM.
  repeated CatHubWinkeyerEndpoint winkeyer_endpoints = 8;
}
