syntax = "proto3";

package qsoripper.services;

option csharp_namespace = "QsoRipper.Services";

import "services/cat_hub_permission.proto";

// A CAT hub `[[cat_hub.serial_endpoint]]` entry: a serial endpoint (com0com virtual pair)
// that a client application (HDSDR/OmniRig, N1MM, ARCP-590, ...) connects to.
message CatHubSerialEndpoint {
  // A label for logging and identification (unique across all client endpoints).
  string name = 1;
  // The serial port the hub binds for this endpoint (a com0com / tty path). The
  // application connects to the OTHER port of the same pair.
  string transport = 2;
  // Baud rate for the endpoint port.
  uint32 baud = 3;
  // Dialect spoken to the client: `ts590` or `ts2000`.
  string dialect = 4;
  // Permission tokens granted to clients of this endpoint.
  repeated CatHubPermission perms = 5;
  // The paired serial port opened by the client application. This is stored
  // for operator guidance; the hub never opens it.
  optional string application_transport = 6;
}
