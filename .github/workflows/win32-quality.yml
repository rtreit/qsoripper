name: Win32 Quality

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/win32-quality.yml"
      - "src/c/**"
  pull_request:
  merge_group:

concurrency:
  group: win32-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  win32-quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run Win32 tests
        shell: pwsh
        run: ./test.ps1 win32 -Configuration Release
