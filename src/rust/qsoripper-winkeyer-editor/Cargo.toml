[package]
name = "qsoripper-winkeyer-editor"
description = "Keyboard-first TUI editor for WinKeyer WK3tools EEPROM configuration files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "qsoripper-winkeyer-editor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = { version = "0.29", features = ["crossterm"] }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
